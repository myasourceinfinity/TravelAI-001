<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset Password — Travel AI</title>
  <meta name="description" content="Reset your Travel AI account password to continue planning your extraordinary journeys across Dubai and Japan." />
  <meta name="theme-color" content="#080b0d" />
  <link rel="canonical" href="https://travel-ai.example/reset-password.html" />

  <!-- Preload scenic background & fonts -->
  <link rel="preload" as="image" href="assets/images/hero.webp" fetchpriority="high" />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-600.woff2" crossorigin />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/reset-password.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- Scripts -->
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script defer src="js/motion/gsap-presets.js"></script>
  <script defer src="js/motion/gsap-text.js"></script>
  <script defer src="js/motion/gsap-engine.js"></script>
  <script defer src="js/site.js"></script>
  <script defer src="js/components/auth.js"></script>
  <script defer src="js/reset-password.js"></script>
</head>
<body class="reset-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Scenic background cover with darkening overlay -->
  <img class="reset-page__bg" src="assets/images/hero.webp" alt="" fetchpriority="high" decoding="async" />
  <div class="reset-page__overlay" aria-hidden="true"></div>

  <!-- Shared Header -->
  <header id="site-header" class="site-header"></header>

  <!-- Main Content -->
  <main class="reset-main" id="main">
    <div class="reset-card" data-motion="fade-up">
      <header class="reset-card__header">
        <h1 class="reset-card__title">Reset your password</h1>
        <p class="reset-card__sub">
          Enter your email and we'll send you a link to reset your password
        </p>
      </header>

      <!-- Password Reset Form -->
      <form class="reset-form" id="reset-password-form" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="reset-email">Email Address</label>
          <div class="auth-input-wrap">
            <input class="auth-input" type="email" id="reset-email" name="email"
                   placeholder="name@example.com" autocomplete="email" aria-describedby="reset-email-error" required />
          </div>
          <span class="auth-error-msg" id="reset-email-error" aria-live="polite"></span>
        </div>

        <button type="submit" class="auth-btn-submit" id="reset-submit-btn">
          Send Reset Link
        </button>
      </form>

      <!-- Confirmation / Success State -->
      <div class="reset-success" id="reset-success-state" tabindex="-1" role="status" aria-live="polite">
        <div class="reset-success__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <p class="reset-success__msg">
          We've sent a password reset link to <span class="reset-success__email" id="reset-sent-email"></span>.
        </p>
        <p class="reset-success__note">
          Didn't receive it? Check your spam folder or 
          <button type="button" class="reset-success__resend" id="reset-resend-btn">resend link</button>.
        </p>
        <span class="auth-error-msg" id="reset-resend-feedback" style="color: var(--color-success);" aria-live="polite"></span>
      </div>

      <!-- Navigation & Return -->
      <nav class="reset-card__nav" aria-label="Authentication navigation">
        <a class="reset-card__back" href="index.html#login" data-auth-trigger="login">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M9 11 5 7l4-4"/>
          </svg>
          <span>Back to Login</span>
        </a>
      </nav>

      <!-- Legal / Support -->
      <footer class="reset-card__footer">
        <p class="reset-card__legal">
          Need help? <a href="contact.html">Contact Travel AI Support</a>
        </p>
      </footer>
    </div>
  </main>

  <!-- Shared Footer -->
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
